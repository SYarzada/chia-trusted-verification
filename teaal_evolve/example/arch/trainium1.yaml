architecture:
  nodes:
    - !Engine
      name: None
      default-attributes:
        cost-metrics: []
      templates:
        - name: RenameOnChip2D
          einsum:
            declaration:
              TO: [M, N]
              TN: [M, N]
            expressions:
              - TN[m, n] = TO[m, n]
          mapping:
            loop-order:
              TN: [M, N]
            spacetime:
              TN:
                space: []
                time: [M, N]
          format:
            TO:
              rank-order:
                TN: [M, N]
              bit-widths: [16, 32]
              data-types: [bfloat, float]
            TN:
              rank-order:
                TN: [M, N]
              bit-widths: [16, 32]
              data-types: [bfloat, float]
          binding:
            engine:
            - einsum: TN
              ranks: [M, N]
              component: None
              instruction: RenameOnChip2D
            tensor:
            - name: TN
              einsum: TN
              components:
                - name: SBUF
                - name: PSUM
              ranks:
                unbound: []
                partition: [M]
                free: [N]
            - name: TO
              einsum: TN
              components:
                - name: SBUF
                - name: PSUM
              ranks:
                unbound: []
                partition: [M]
                free: [N]
          options:
            cascade-outputs: [TN]
          code-gen:
          - <tensor.TN.name> = <tensor.TO.name>
        - name: RenameOnChip3D
          einsum:
            declaration:
              TO: [M, N, O]
              TN: [M, N, O]
            expressions:
              - TN[m, n, o] = TO[m, n, o]
          mapping:
            loop-order:
              TN: [M, N, O]
            spacetime:
              TN:
                space: []
                time: [M, N, O]
          format:
            TO:
              rank-order:
                TN: [M, N, O]
              bit-widths: [16, 32]
              data-types: [bfloat, float]
            TN:
              rank-order:
                TN: [M, N, O]
              bit-widths: [16, 32]
              data-types: [bfloat, float]
          binding:
            engine:
            - einsum: TN
              ranks: [M, N, O]
              component: None
              instruction: RenameOnChip3D
            tensor:
            - name: TN
              einsum: TN
              components:
                - name: SBUF
                - name: PSUM
              ranks:
                unbound: []
                partition: [M]
                free: [N, O]
            - name: TO
              einsum: TN
              components:
                - name: SBUF
                - name: PSUM
              ranks:
                unbound: []
                partition: [M]
                free: [N, O]
          options:
            cascade-outputs: [TN]
          code-gen:
          - <tensor.TN.name> = <tensor.TO.name>
        - name: RenameHBM2D
          einsum:
            declaration:
              TO: [M, N]
              TN: [M, N]
            expressions:
              - TN[m, n] = TO[m, n]
          mapping:
            loop-order:
              TN: [M, N]
            spacetime:
              TN:
                space: []
                time: [M, N]
          format:
            TO:
              rank-order:
                TN: [M, N]
              bit-widths: [16, 32]
              data-types: [bfloat, float]
            TN:
              rank-order:
                TN: [M, N]
              bit-widths: [16, 32]
              data-types: [bfloat, float]
          binding:
            engine:
            - einsum: TN
              ranks: [M, N]
              component: None
              instruction: RenameHBM2D
            tensor:
            - name: TN
              einsum: TN
              component:
                name: HBM
              ranks:
                unbound: []
                bound: [M, N]
            - name: TO
              einsum: TN
              component:
                name: HBM
              ranks:
                unbound: []
                bound: [M, N]
          options:
            cascade-outputs: [TN]
          code-gen:
          - <tensor.TN.name> = <tensor.TO.name>
        - name: RenameHBM3D
          einsum:
            declaration:
              TO: [M, N, O]
              TN: [M, N, O]
            expressions:
              - TN[m, n, o] = TO[m, n, o]
          mapping:
            loop-order:
              TN: [M, N, O]
            spacetime:
              TN:
                space: []
                time: [M, N, O]
          format:
            TO:
              rank-order:
                TN: [M, N, O]
              bit-widths: [16, 32]
              data-types: [bfloat, float]
            TN:
              rank-order:
                TN: [M, N, O]
              bit-widths: [16, 32]
              data-types: [bfloat, float]
          binding:
            engine:
            - einsum: TN
              ranks: [M, N, O]
              component: None
              instruction: RenameHBM3D
            tensor:
            - name: TN
              einsum: TN
              component:
                name: HBM
              ranks:
                unbound: []
                bound: [M, N, O]
            - name: TO
              einsum: TN
              component:
                name: HBM
              ranks:
                unbound: []
                bound: [M, N, O]
          options:
            cascade-outputs: [TN]
          code-gen:
          - <tensor.TN.name> = <tensor.TO.name>
    - !Memory
      name: HBM
      attributes:
        ranks:
          - name: bound
        bit-widths: [16, 32]
        data-types: [bfloat, float]

        ports:
          - name: DMAPort
            engines: [DMAEngine, None]
            bandwidth: 3.5218e12
      constructors:
        empty: <tensor.name> = nl.ndarray((<tensor.ranks.bound.shapes>), dtype=nl.<tensor.data_type><tensor.bit_width>, buffer=nl.shared_hbm)
        zeros: <tensor.name> = nl.zeros((<tensor.ranks.bound.shapes>), dtype=nl.<tensor.data_type><tensor.bit_width>, buffer=nl.shared_hbm)
        none: "# No constructor required for <tensor.name>"
      access-template: <tensor.name>.ap(<tensor.ranks.bound.pattern>, <tensor.ranks.linearized_offset>)
      reshape-template: <tensor.name>
    - !Parallel
      nodes:
      - !Memory
        name: DMAEnginePipelineRegisters
        attributes:
          ranks:
            - name: partition
            - name: registers
          bit-widths: [16, 32]
          data-types: [bfloat, float]
        constructors:
          default: "# No explicit constructor for <tensor.name>"
        access-template: "# No explicit accesses for <tensor.name>"
        reshape-template: "# No explicit reshape for <tensor.name>"
      - !Engine
        name: DMAEngine
        default-attributes:
          cost-metrics: [memory]
        templates:
        - name: Load
          einsum:
            declaration:
              TH: [P, F]
              TS: [P, F]
            expressions:
              - TS[p, f] = TH[p, f]
            shape:
              P: 128
          mapping:
            loop-order:
              TS: [P, F]
            spacetime:
              TS:
                space: [P]
                time: [F]
          format:
            TH:
              rank-order:
                TS: [P, F]
              bit-widths: [16, 32]
              data-types: [bfloat, float]
            TS:
              rank-order:
                TS: [P, F]
              bit-widths: [16, 32]
              data-types: [bfloat, float]
          binding:
            engine:
            - einsum: TS
              ranks: [P, F]
              component: DMAEngine
              instruction: Load
            tensor:
            - name: TS
              einsum: TS
              component:
                name: SBUF
              ranks:
                unbound: []
                partition: [P]
                free: [F]
            - name: TH
              einsum: TS
              component:
                name: HBM
              ranks:
                unbound: []
                bound: [P, F]
          options:
            cascade-outputs: [TS]
          code-gen:
          - nisa.dma_copy(<tensor.TS.access>, <tensor.TH.access>)
        - name: Store
          einsum:
            declaration:
              TS: [P, F]
              TH: [P, F]
            expressions:
              - TH[p, f] = TS[p, f]
            shape:
              P: 128
          mapping:
            loop-order:
              TH: [P, F]
            spacetime:
              TH:
                space: [P]
                time: [F]
          format:
            TH:
              rank-order:
                TH: [P, F]
              bit-widths: [16, 32]
              data-types: [bfloat, float]
            TS:
              rank-order:
                TH: [P, F]
              bit-widths: [16, 32]
              data-types: [bfloat, float]
          binding:
            engine:
            - einsum: TH
              ranks: [P, F]
              component: DMAEngine
              instruction: Store
            tensor:
            - name: TS
              einsum: TH
              component:
                name: SBUF
              ranks:
                unbound: []
                partition: [P]
                free: [F]
            - name: TH
              einsum: TH
              component:
                name: HBM
              ranks:
                unbound: []
                bound: [P, F]
          options:
            cascade-outputs: [TH]
          code-gen:
          - nisa.dma_copy(<tensor.TH.access>, <tensor.TS.access>)
        - name: RMW
          einsum:
            declaration:
              TH: [II, P, F]
              TS: [II, P, F]
              M: [II, P, F]
            expressions:
              - M[i, p, f] = TH[i, p, f] . TS[i, p, f] ;; M binary[<op>]
              - TH[i + 1, p, f] = M[i, p, f]
            shape:
              P: 128
          mapping:
            loop-order:
              M: [I, P, F]
              TH: [I, P, F]
            spacetime:
              M:
                space: [P]
                time: [I, F]
              TH:
                space: [P]
                time: [I, F]
            fusion:
            - einsums: [M, TH]
              ranks:
              - [M.I, TH.I]
              - [M.P, TH.P]
              - [M.F, TH.F]
          format:
            TS:
              rank-order:
                M: [II, P, F]
              bit-widths: [16, 32]
              data-types: [bfloat, float]
            M:
              rank-order:
                M: [II, F, P]
                TH: [II, F, P]
              bit-widths: [16, 32]
              data-types: [bfloat, float]
            TH:
              rank-order:
                M: [II, P, F]
                TH: [II, P, F]
              bit-widths: [16, 32]
              data-types: [bfloat, float]
          binding:
            engine:
            - einsums: [M, TH]
              ranks:
                M: [P, F]
                TH: [P, F]
              component: DMAEngine
              instruction: RMW
            tensor:
            - name: TS
              einsum: M
              component:
                name: SBUF
              ranks:
                unbound: [II]
                partition: [P]
                free: [F]
            - name: M
              einsum: M
              component:
                name: DMAEnginePipelineRegisters
              ranks:
                unbound: [II, F]
                partition: [P]
                registers: []
            - name: M
              einsum: TH
              component:
                name: DMAEnginePipelineRegisters
              ranks:
                unbound: [II, F]
                partition: [P]
                registers: []
            - name: TH
              einsum: M
              component:
                name: HBM
              ranks:
                unbound: [II]
                bound: [P, F]
            - name: TH
              einsum: TH
              component:
                name: HBM
              ranks:
                unbound: [II]
                bound: [P, F]
          options:
            cascade-outputs: [TH]
          code-gen:
          - nisa.dma_copy(<tensor.TS.access>, <tensor.TH.access>, dst_rmw_op=nl.<op>)
    - !Parallel
      nodes:
      - !Memory
        name: SBUF
        attributes:
          ranks:
            - name: partition
            - name: free
          bit-widths: [8, 16, 32]
          data-types: [bfloat, float, uint]
          ports:
            - name: ScalarEngineSBUFPort
              engines: [ScalarEngine]
            - name: VectorGPSimdEngineSBUFPort
              engines: [VectorEngine, GPSimdEngine]
            - name: TensorEngineSBUFPort
              engines: [TensorEngine]
            - name: DMAEngineSBUFPort
              engines: [DMAEngine, None]
        constructors:
          empty: <tensor.name> = nl.ndarray((<tensor.ranks.partition.shapes>, <tensor.ranks.free.shapes>), dtype=nl.<tensor.data_type><tensor.bit_width>, buffer=nl.sbuf)
          zeros: <tensor.name> = nl.zeros((<tensor.ranks.partition.shapes>, <tensor.ranks.free.shapes>), dtype=nl.<tensor.data_type><tensor.bit_width>, buffer=nl.sbuf)
          none: "# No constructor required for <tensor.name>"
        access-template: <tensor.name>.ap(<tensor.ranks.partition.pattern> + <tensor.ranks.free.pattern>, <tensor.ranks.linearized_offset>)
        reshape-template: <tensor.name>
      - !Memory
        name: PSUM
        attributes:
          ranks:
            - name: partition
            - name: free
          bit-widths: [16, 32]
          data-types: [bfloat, float]
          ports:
            - name: TensorEnginePSUMPort
              engines: [TensorEngine]
            - name: VectorScalarEnginePSUMPort
              engines: [ScalarEngine, VectorEngine, None]
        constructors:
          empty: <tensor.name> = nl.ndarray((<tensor.ranks.partition.shapes>, <tensor.ranks.free.shapes>), dtype=nl.<tensor.data_type><tensor.bit_width>, buffer=nl.psum)
          zeros: <tensor.name> = nl.zeros((<tensor.ranks.partition.shapes>, <tensor.ranks.free.shapes>), dtype=nl.<tensor.data_type><tensor.bit_width>, buffer=nl.psum)
        access-template: <tensor.name>.ap(<tensor.ranks.partition.pattern> + <tensor.ranks.free.pattern>, <tensor.ranks.linearized_offset>)
        reshape-template: <tensor.name>
    - !Parallel
      nodes:
      - !Engine
        name: TensorEngine
        default-attributes:
          cost-metrics: [compute]
          frequency: 2.8e9
          op-init-latency: 1
          instruction-init-latency: 64
        templates:
        - name: MatMul16
          einsum:
            declaration:
              A: [K, M]
              B: [K, N]
              Z: [M, N]
            expressions:
              - Z[m, n] = A[k, m] . B[k, n] ;; M binary[multiply] V binary[add]
            shape:
              K: 128
              M: 128
              N: 512
          mapping:
            loop-order:
              Z: [K, M, N]
            spacetime:
              Z:
                space: [K, M]
                time: [N]
          format:
            A:
              rank-order:
                Z: [K, M]
              bit-widths: [16]
              data-types: [bfloat, float]
            B:
              rank-order:
                Z: [K, N]
              bit-widths: [16]
              data-types: [bfloat, float]
            Z:
              rank-order:
                Z: [M, N]
              bit-widths: [32]
              data-types: [float]
          binding:
            engine:
            - einsum: Z
              component: TensorEngine
              instruction: MatMul16
              ranks: [K, M, N]
            tensor:
            - name: A
              einsum: Z
              component:
                name: SBUF
              ranks:
                unbound: []
                partition: [K]
                free: [M]
            - name: B
              einsum: Z
              component:
                name: SBUF
              ranks:
                unbound: []
                partition: [K]
                free: [N]
            - name: Z
              einsum: Z
              component:
                name: PSUM
              ranks:
                unbound: []
                partition: [M]
                free: [N]
          options:
            cascade-outputs: [Z]
          code-gen:
          - nisa.nc_matmul(<tensor.Z.access>, <tensor.A.access>, <tensor.B.access>)
        - name: MatMul32
          attributes:
            op-init-latency: 4
          einsum:
            declaration:
              A: [K, M]
              B: [K, N]
              Z: [M, N]
            expressions:
              - Z[m, n] = A[k, m] . B[k, n] ;; M binary[multiply] V binary[add]
            shape:
              K: 128
              M: 128
              N: 512
          mapping:
            loop-order:
              Z: [K, M, N]
            spacetime:
              Z:
                space: [K, M]
                time: [N]
          format:
            A:
              rank-order:
                Z: [K, M]
              bit-widths: [32]
              data-types: [float]
            B:
              rank-order:
                Z: [K, N]
              bit-widths: [32]
              data-types: [float]
            Z:
              rank-order:
                Z: [M, N]
              bit-widths: [32]
              data-types: [float]
          binding:
            engine:
            - einsum: Z
              component: TensorEngine
              instruction: MatMul32
              ranks: [K, M, N]
            tensor:
            - name: A
              einsum: Z
              component:
                name: SBUF
              ranks:
                unbound: []
                partition: [K]
                free: [M]
            - name: B
              einsum: Z
              component:
                name: SBUF
              ranks:
                unbound: []
                partition: [K]
                free: [N]
            - name: Z
              einsum: Z
              component:
                name: PSUM
              ranks:
                unbound: []
                partition: [M]
                free: [N]
          options:
            cascade-outputs: [Z]
          code-gen:
          - nisa.nc_matmul(<tensor.Z.access>, <tensor.A.access>, <tensor.B.access>)
        - name: Transpose16
          attributes:

            op-init-latency: 128
          einsum:
            declaration:
              A: [M, N]
              AT: [M, N]
            expressions:
              - AT[m, n] = A[m, n]
            shape:
              M: 128
              N: 128
          mapping:
            loop-order:
              AT: [M, N]
            spacetime:
              AT:
                space: [M, N]
                time: []
          format:
            A:
              rank-order:
                AT: [M, N]
              bit-widths: [16]
              data-types: [bfloat, float]
            AT:
              rank-order:
                AT: [N, M]
              bit-widths: [16]
              data-types: [bfloat, float]
          binding:
            engine:
            - einsum: AT
              component: TensorEngine
              instruction: Transpose16
              ranks: [M, N]
            tensor:
            - name: A
              einsum: AT
              component:
                name: SBUF
              ranks:
                unbound: []
                partition: [M]
                free: [N]
            - name: AT
              einsum: AT
              component:
                name: PSUM
              ranks:
                unbound: []
                partition: [N]
                free: [M]
          options:
            cascade-outputs: [AT]
          code-gen:

          - nisa.nc_transpose(<tensor.AT.access>, <tensor.A.access>, engine=nisa.tensor_engine)

        - name: Transpose32
          attributes:


            op-init-latency: 512
          einsum:
            declaration:
              A: [M, N]
              AT: [M, N]
            expressions:
              - AT[m, n] = A[m, n]
            shape:
              M: 128
              N: 128
          mapping:
            loop-order:
              AT: [M, N]
            spacetime:
              AT:
                space: [M, N]
                time: []
          format:
            A:
              rank-order:
                AT: [M, N]
              bit-widths: [32]
              data-types: [float]
            AT:
              rank-order:
                AT: [N, M]
              bit-widths: [32]
              data-types: [float]
          binding:
            engine:
            - einsum: AT
              component: TensorEngine
              instruction: Transpose32
              ranks: [M, N]
            tensor:
            - name: A
              einsum: AT
              component:
                name: SBUF
              ranks:
                unbound: []
                partition: [M]
                free: [N]
            - name: AT
              einsum: AT
              component:
                name: PSUM
              ranks:
                unbound: []
                partition: [N]
                free: [M]
          options:
            cascade-outputs: [AT]
          code-gen:

          - nisa.nc_transpose(<tensor.AT.access>, <tensor.A.access>, engine=nisa.tensor_engine)

      - !Parallel
        nodes:
        - !Memory
          name: VectorEnginePipelineRegisters
          attributes:
            ranks:
              - name: partition
              - name: registers
            bit-widths: [32]
            data-types: [float]
          constructors:
            default: "# No explicit constructor for <tensor.name>"
          access-template: "# No explicit accesses for <tensor.name>"
          reshape-template: "# No explicit reshape for <tensor.name>"
        - !Engine
          name: VectorEngine
          default-attributes:
            cost-metrics: [compute]
            frequency: 1.12e9
            op-init-latency: 1
            instruction-init-latency: 100
          templates:
          - name: Transpose
            einsum:
              declaration:
                A: [M, N]
                AT: [M, N]
              expressions:
                - AT[m, n] = A[m, n]
              shape:
                M: 32
                N: 32
            mapping:
              loop-order:
                AT: [M, N]
              spacetime:
                AT:
                  space: [M, N]
                  time: []
            format:
              A:
                rank-order:
                  AT: [M, N]
                bit-widths: [16, 32]
                data-types: [bfloat, float]
              AT:
                rank-order:
                  AT: [M, N]
                bit-widths: [16, 32]
                data-types: [bfloat, float]
            binding:
              engine:
              - einsum: AT
                component: VectorEngine
                instruction: Transpose
                ranks: [M, N]
              tensor:
              - name: A
                einsum: AT
                components:
                  - name: SBUF
                  - name: PSUM
                ranks:
                  unbound: []
                  partition: [M]
                  free: [N]
              - name: AT
                einsum: AT
                components:
                  - name: SBUF
                  - name: PSUM
                ranks:
                  unbound: []
                  partition: [N]
                  free: [M]
            options:
              cascade-outputs: [AT]
            code-gen:
            - nisa.nc_transpose(<tensor.AT.access>, <tensor.A.access>, engine=nisa.vector_engine)
          - name: TensorReduce
            einsum:
              declaration:
                A: [P, F]
                R: [P]
              expressions:
                - R[p] = A[p, f] ;; V binary[<op>]
              shape:
                P: 128
            mapping:
              loop-order:
                R: [P, F]
              spacetime:
                R:
                  space: [P]
                  time: [F]
            format:
              A:
                rank-order:
                  R: [P, F]
                bit-widths: [16, 32]
                data-types: [bfloat, float]
              R:
                rank-order:
                  R: [P]
                bit-widths: [16, 32]
                data-types: [bfloat, float]
            binding:
              engine:
              - einsums: [R]
                component: VectorEngine
                instruction: TensorReduce
                ranks:
                  R: [P, F]
              tensor:
              - name: A
                einsum: R
                components:
                  - name: SBUF
                  - name: PSUM
                ranks:
                  unbound: []
                  partition: [P]
                  free: [F]
              - name: R
                einsum: R
                components:
                  - name: SBUF
                  - name: PSUM
                ranks:
                  unbound: []
                  partition: [P]
                  free: []
            options:
              cascade-outputs: [R]
            code-gen:
            - nisa.tensor_reduce(<tensor.R.access>, nl.<op>, <tensor.A.access>, axis=[1], negate=False)
          - name: TensorReduceNegate
            attributes:

              op-init-latency:
                R: 1
                N: 0
            einsum:
              declaration:
                A: [P, F]
                R: [P]
                N: [P]
              expressions:
                - R[p] = A[p, f] ;; V binary[<op>]
                - N[p] = -1 . R[p] ;; M binary[multiply]
              shape:
                P: 128
            mapping:
              loop-order:
                R: [P, F]
                N: [P]
              spacetime:
