  - RM_update: RM[p4, p3, p2, p1, p0, m3, m2 + 1] = RM[p4, p3, p2, p1, p0, m3, m2
      + 0] . LM[p4, p3, p2, p1, p0, m3, m2] ;; M binary[minimum]
  - BQKSRM[p4, p3, p2, p1, p0, m3, m2, m1, m0] = BQKS[p4, p3, p2, p1, p0, m3, m2,
    m1, m0] . RM[p4, p3, p2, p1, p0, m3, m2 + 1] ;; M binary[add]
  - SLN[p4, p3, p2, p1, p0, m3, m2, m1, m0] = BQKSRM[p4, p3, p2, p1, p0, m3, m2, m1,
    m0] ;; M unary[exp]
  - SLD[p4, p3, p2, p1, p0, m3, m2] = SLN[p4, p3, p2, p1, p0, m3, m2, m1, m0] ;; V
    binary[add]
  - SLNTP[p4, p3, p2, p1, p0, m3, m2, m1, m0] = SLN[p4, p3, p2, p1, p0, m3, m2, m1,
    m0]
  - SLNTS[p4, p3, p2, p1, p0, m3, m2, m1, m0] = SLNTP[p4, p3, p2, p1, p0, m3, m2,
    m1, m0]
  - SLNTVP[p4, p3, p2, p1, p0, m3, m2, f] = SLNTS[p4, p3, p2, p1, p0, m3, m2, m1,
    m0] . VS[f, p4, m3, m2, m1, m0] ;; M binary[multiply] V binary[add]
  - SLNTVS[p4, p3, p2, p1, p0, m3, m2, f] = SLNTVP[p4, p3, p2, p1, p0, m3, m2, f]
  - RMSB[p4, p3, p2, p1, p0, m3, m2] = RM[p4, p3, p2, p1, p0, m3, m2 + 1] . RMS[p4,
