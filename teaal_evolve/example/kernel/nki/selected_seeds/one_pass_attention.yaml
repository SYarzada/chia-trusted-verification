  - PRM[p4, p3, p2, p1, p0, m3, m2] = RMSB[p4, p3, p2, p1, p0, m3, m2] ;; M unary[exp]
  - SPD[p4, p3, p2, p1, p0, m3, m2] = RD[p4, p3, p2, p1, p0, m3, m2 + 0] . PRM[p4,
    p3, p2, p1, p0, m3, m2] ;; M binary[multiply]
  - RD_update: RD[p4, p3, p2, p1, p0, m3, m2 + 1] = SLD[p4, p3, p2, p1, p0, m3, m2]
      . SPD[p4, p3, p2, p1, p0, m3, m2] ;; M binary[add]
  - SPNV[p4, p3, p2, p1, p0, m3, m2, f] = RNV[p4, p3, p2, p1, p0, m3, m2 + 0, f] .
