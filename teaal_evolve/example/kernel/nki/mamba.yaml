      H_init: [B, T1, D11, N, D10, T0, D0]
      SI_update: [B, T1, D11, N, D10, T0, D0]
      H_update: [B, T1, D11, N, D10, T0, D0]
    bit-width: 32
    data-type: float
  H:
    rank-order:
      H_init: [B, T1, D11, N, D10, D0, T0]
      SI_update: [B, T1, D11, N, D10, D0, T0]
      H_update: [B, T1, D11, N, D10, D0, T0]
      I_update: [B, T1, D11, N, D10, D0, T0]
      HT: [B, T1, D11, N, D10, D0, T0]
    bit-width: 32
    data-type: float
  HT:
    rank-order:
      HT: [B, T1, D11, N, D10, T0, D0]
      HC: [B, T1, D11, N, D10, T0, D0]
    bit-width: 32
    data-type: float
  HC:
    rank-order:
      HC: [B, T1, D11, N, D10, D0, T0]
      ZS_update: [B, T1, D11, N, D10, D0, T0]
    bit-width: 32
    data-type: float
  ZH:
    rank-order:
      ZH: [B, T1, T0, D1, D0]
      Z: [B, T1T0, D1D0]
    bit-width: 32
    data-type: float
  Z:
    rank-order:
      Z: [B, T1T0, D1D0]
    bit-width: 32
    data-type: float
binding:
  engine:
    - einsum: AH
      ranks: [D1D0, N]
      component: None
      instruction: RenameHBM2D
    - einsum: BH
      ranks: [B, T1T0, N]
      component: None
      instruction: RenameHBM3D
    - einsum: CH
      ranks: [B, T1T0, N]
      component: None
      instruction: RenameHBM3D
    - einsum: DH
      ranks: [B, T1T0, D1D0]
      component: None
      instruction: RenameHBM3D
    - einsum: UH
      ranks: [B, T1T0, D1D0]
      component: None
      instruction: RenameHBM3D
    - einsum: ZERO
      ranks: [T0, D0]
      component: VectorEngine
      instruction: MemSet
    - einsum: I_init
      ranks: [D0, D11ND10]
      component: VectorEngine
      instruction: MemSet
    - einsum: AS
      ranks: [D0, N]
      component: DMAEngine
      instruction: Load
    - einsum: DS
      ranks: [T0, D0]
      component: DMAEngine
      instruction: Load
    - einsum: DP
      ranks: [T0, D0]
      component: TensorEngine
      instruction: Transpose32
    - einsum: DT
      ranks: [D0, T0]
      component: ScalarEngine
      instruction: TensorCopy
    - einsum: US
      ranks: [T0, D0]
      component: DMAEngine
      instruction: Load
    - einsum: DU
      ranks: [T0, D0]
      component: VectorEngine
      instruction: TensorTensorSS
    - einsum: BS
      ranks: [T0, N]
      component: DMAEngine
      instruction: Load
    - einsum: CS
      ranks: [T0, N]
      component: DMAEngine
      instruction: Load
    - einsum: ZS_init
      ranks: [T0, D0]
      component: ScalarEngine
      instruction: TensorCopy
    - einsums: [DA, EDA]
      ranks:
        DA: [D0, T0]
        EDA: [D0, T0]
      component: ScalarEngine
      instruction: ScaledUnary
    - einsum: DUB
      ranks: [T0, D0]
      component: ScalarEngine
      instruction: TensorScalarMultiply
    - einsum: DUBT
      ranks: [T0, D0]
      component: TensorEngine
      instruction: Transpose32
    - einsums: [SI_init, H_init, SI_update, H_update]
      ranks:
        SI_init: [D0]
        H_init: [D0]
        SI_update: [D0, T0I]
        H_update: [D0, T0I]
      component: VectorEngine
      instruction: TensorTensorScanSP
    - einsum: I_update
      ranks: [D0, D10]
      component: ScalarEngine
      instruction: TensorCopy
    - einsum: HT
      ranks: [D0, T0]
      component: TensorEngine
      instruction: Transpose32
    - einsums: [HC, ZS_update]
      ranks:
        HC: [T0, D0]
        ZS_update: [T0, D0]
      component: VectorEngine
      instruction: TensorTensorScalarSP
    - einsum: ZH
      ranks: [T0, D0]
      component: DMAEngine
