einsum:
  declaration:
    A: [D1, D0, N]
    BF: [B, N, T1, T0]
    C: [B, N, T1, T0]
    DF: [B, D1, D0, T1, T0]
    U: [B, D1, D0, T1, T0]
    AH: [D1, D0, N]
    BH: [B, N, T1, T0]
    CH: [B, N, T1, T0]
    DH: [B, D1, D0, T1, T0]
    UH: [B, D1, D0, T1, T0]
    ZERO: [D0, T0]
    I: [B, D1, D0, N, T1I]
    DS: [B, D1, D0, T1, T0]
    DP: [B, D1, D0, T1, T0]
    DT: [B, D1, D0, T1, T0]
    US: [B, D1, D0, T1, T0]
    DU: [B, D1, D0, T1, T0]
    AS: [B, D1, D0, N]
    DA: [B, D1, D0, N, T1, T0]
    EDA: [B, D1, D0, N, T1, T0]
    BS: [B, N, T1, T0]
    DUB: [B, D1, D0, N, T1, T0]
    DUBT: [B, D1, D0, N, T1, T0]
    SI: [B, D1, D0, N, T1, T0]
    H: [B, D1, D0, N, T1, T0]
    HT: [B, D1, D0, N, T1, T0]
    CS: [B, N, T1, T0]
    HC: [B, D1, D0, N, T1, T0]
    ZS: [B, D1, D0, NI, T1, T0]
    ZH: [B, D1, D0, T1, T0]
    Z: [B, D1, D0, T1, T0]
  expressions:
    - AH[d1, d0, n] = A[d1, d0, n]
    - BH[b, n, t1, t0] = BF[b, n, t1, t0]
    - CH[b, n, t1, t0] = C[b, n, t1, t0]
    - DH[b, d1, d0, t1, t0] = DF[b, d1, d0, t1, t0]
    - UH[b, d1, d0, t1, t0] = U[b, d1, d0, t1, t0]
    - ZERO[d0, t0] = 0
    - I_init: I[b, d1, d0, n, 0] = 0
    - AS[b, d1, d0, n] = AH[d1, d0, n]
    - BS[b, n, t1, t0] = BH[b, n, t1, t0]
    - CS[b, n, t1, t0] = CH[b, n, t1, t0]
    - ZS_init: ZS[b, d1, d0, 0, t1, t0] = ZERO[d0, t0]
    - DS[b, d1, d0, t1, t0] = DH[b, d1, d0, t1, t0]
    - DP[b, d1, d0, t1, t0] = DS[b, d1, d0, t1, t0]
    - DT[b, d1, d0, t1, t0] = DP[b, d1, d0, t1, t0]
    - US[b, d1, d0, t1, t0] = UH[b, d1, d0, t1, t0]
    - DU[b, d1, d0, t1, t0] = DS[b, d1, d0, t1, t0] . US[b, d1, d0, t1, t0] ;; M binary[multiply]
    - DA[b, d1, d0, n, t1, t0] = DT[b, d1, d0, t1, t0] . AS[b, d1, d0, n] ;; M binary[multiply]
    - EDA[b, d1, d0, n, t1, t0] = DA[b, d1, d0, n, t1, t0] ;; M unary[exp]
    - DUB[b, d1, d0, n, t1, t0] = DU[b, d1, d0, t1, t0] . BS[b, n, t1, t0] ;; M binary[multiply]
    - DUBT[b, d1, d0, n, t1, t0] = DUB[b, d1, d0, n, t1, t0]
    - SI_init: SI[b, d1, d0, n, t1, 0] = I[b, d1, d0, n, t1] . EDA[b, d1, d0, n, t1, 0] ;; M binary[multiply]
    - H_init: H[b, d1, d0, n, t1, 0] = SI[b, d1, d0, n, t1, 0] . DUBT[b, d1, d0, n, t1, 0] ;; M binary[add]
    - SI_update: SI[b, d1, d0, n, t1, t0i + 1] = H[b, d1, d0, n, t1, t0i] . EDA[b, d1, d0, n, t1, t0i + 1] ;; M binary[multiply]
    - H_update: H[b, d1, d0, n, t1, t0i + 1] = SI[b, d1, d0, n, t1, t0i + 1] . DUBT[b, d1, d0, n, t1, t0i + 1] ;; M binary[add]
    - I_update: I[b, d1, d0, n, t1 + 1] = H[b, d1, d0, n, t1, T0 + -1]
    - HT[b, d1, d0, n, t1, t0] = H[b, d1, d0, n, t1, t0]
    - HC[b, d1, d0, n, t1, t0] = HT[b, d1, d0, n, t1, t0] . CS[b, n, t1, t0] ;; M binary[multiply]
    - ZS_update: ZS[b, d1, d0, n + 1, t1, t0] = ZS[b, d1, d0, n + 0, t1, t0] . HC[b, d1, d0, n, t1, t0] ;; M binary[add]
    - ZH[b, d1, d0, t1, t0] = ZS[b, d1, d0, N, t1, t0]
    - Z[b, d1, d0, t1, t0] = ZH[b, d1, d0, t1, t0]
  shape:
    T0: 128
    T0I: 127
    D0: 128
options:
  kernel-name: mamba
  cascade-outputs: [Z]
mapping:
  partitioning:
    AH:
      (D1, D0): [flatten()]
    BH:
      (T1, T0): [flatten()]
    CH:
      (T1, T0): [flatten()]
    DH:
      (D1, D0): [flatten()]
      (T1, T0): [flatten()]
    UH:
      (D1, D0): [flatten()]
      (T1, T0): [flatten()]
    I_init:
      D1: [uniform_shape(D10)]
      (D11, N, D10): [flatten()]
    DS:
      D1: [uniform_shape(D10)]
    DP:
      D1: [uniform_shape(D10)]
    DT:
      D1: [uniform_shape(D10)]
    US:
      D1: [uniform_shape(D10)]
    DU:
      D1: [uniform_shape(D10)]
    DA:
      D1: [uniform_shape(D10)]
    EDA:
      D1: [uniform_shape(D10)]
    DUB:
      D1: [uniform_shape(D10)]
    DUBT:
      D1: [uniform_shape(D10)]
    SI_init:
      D1: [uniform_shape(D10)]
    H_init:
      D1: [uniform_shape(D10)]
    SI_update:
      D1: [uniform_shape(D10)]
    H_update:
      D1: [uniform_shape(D10)]
    I_update:
      D1: [uniform_shape(D10)]
    HT:
      D1: [uniform_shape(D10)]
    HC:
      D1: [uniform_shape(D10)]
    ZS_update:
      D1: [uniform_shape(D10)]
    Z:
      (D1, D0): [flatten()]
      (T1, T0): [flatten()]
  loop-order:
    AH: [D1D0, N]
    BH: [B, T1T0, N]
    CH: [B, T1T0, N]
    DH: [B, T1T0, D1D0]
    UH: [B, T1T0, D1D0]
    ZERO: [T0, D0]
    I_init: [B, D0, D11ND10]
    AS: [B, D1, D0, N]
    DS: [B, T1, D11, D10, T0, D0]
    DP: [B, T1, D11, D10, T0, D0]
    DT: [B, T1, D11, D10, D0, T0]
    US: [B, T1, D11, D10, T0, D0]
    DU: [B, T1, D11, D10, T0, D0]
    BS: [B, T1, T0, N]
    CS: [B, T1, T0, N]
    ZS_init: [B, T1, D1, T0, D0]
    DA: [B, T1, D11, N, D10, D0, T0]
    EDA: [B, T1, D11, N, D10, D0, T0]
    DUB: [B, T1, D11, N, D10, T0, D0]
    DUBT: [B, T1, D11, N, D10, T0, D0]
    SI_init: [B, T1, D11, N, D10, D0]
    H_init: [B, T1, D11, N, D10, D0]
    SI_update: [B, T1, D11, N, D10, D0, T0I]
    H_update: [B, T1, D11, N, D10, D0, T0I]
    I_update: [B, T1, D11, N, D0, D10]
    HT: [B, T1, D11, N, D10, D0, T0]
    HC: [B, T1, D11, N, D10, T0, D0]
    ZS_update: [B, T1, D11, N, D10, T0, D0]
    ZH: [B, T1, D1, T0, D0]
    Z: [B, T1T0, D1D0]
  spacetime:
    AH:
      space: []
      time: [D1D0, N]
    BH:
      space: []
      time: [B, T1T0, N]
    CH:
      space: []
      time: [B, T1T0, N]
    DH:
      space: []
      time: [B, T1T0, D1D0]
    UH:
      space: []
      time: [B, T1T0, D1D0]
    ZERO:
      space: [T0]
      time: [D0]
    I_init:
      space: [D0]
      time: [B, D11ND10]
    AS:
      space: [D0]
      time: [B, D1, N]
    DS:
      space: [T0]
      time: [B, T1, D11, D10, D0]
    DP:
      space: [T0, D0]
      time: [B, T1, D11, D10]
    DT:
      space: [D0, T0]
      time: [B, T1, D11, D10]
    US:
      space: [T0]
      time: [B, T1, D11, D10, D0]
    DU:
      space: [T0]
      time: [B, T1, D11, D10, D0]
    BS:
      space: [T0]
      time: [B, T1, N]
    CS:
      space: [T0]
      time: [B, T1, N]
    ZS_init:
      space: [T0]
      time: [B, T1, D1, D0]
    DA:
      space: [D0]
      time: [B, T1, D11, N, D10, T0]
    EDA:
      space: [D0]
      time: [B, T1, D11, N, D10, T0]
    DUB:
      space: [T0]
      time: [B, T1, D11, N, D10, D0]
    DUBT:
      space: [T0, D0]
      time: [B, T1, D11, N, D10]
    SI_init:
      space: [D0]
      time: [B, T1, D11, N, D10]
    H_init:
      space: [D0]
      time: [B, T1, D11, N, D10]
    SI_update:
      space: [D0]
      time: [B, T1, D11, N, D10, T0I]
    H_update:
      space: [D0]
      time: [B, T1, D11, N, D10, T0I]
    I_update:
      space: [D0]
      time: [B, T1, D11, N, D10]
    HT:
      space: [D0, T0]
      time: [B, T1, D11, N, D10]
    HC:
      space: [T0]
      time: [B, T1, D11, N, D10, D0]
    ZS_update:
      space: [T0]
      time: [B, T1, D11, N, D10, D0]
    ZH:
      space: [T0]
      time: [B, T1, D1, D0]
    Z:
      space: []
      time: [B, T1T0, D1D0]
  fusion:
    - einsums: [AH, BH, CH, DH, UH, ZERO, I_init, AS, DS, DP, DT, US, DU, BS, CS, ZS_init, DA, EDA, DUB, DUBT, SI_init, H_init, SI_update, H_update, I_update, HT, HC, ZS_update, ZH, Z]
      ranks:
        - [I_init.B, AS.B, DS.B, DP.B, DT.B, US.B, DU.B, BS.B, CS.B, ZS_init.B, DA.B, EDA.B, DUB.B, DUBT.B, SI_init.B, H_init.B, SI_update.B, H_update.B, I_update.B, HT.B, HC.B, ZS_update.B, ZH.B]
        - [DS.T1, DP.T1, DT.T1, US.T1, DU.T1, BS.T1, CS.T1, DA.T1, EDA.T1, DUB.T1, DUBT.T1, SI_init.T1, H_init.T1, SI_update.T1, H_update.T1, I_update.T1, HT.T1, HC.T1, ZS_init.T1, ZS_update.T1, ZH.T1]
        - D11: [DS.D11, DP.D11, DT.D11, US.D11, DU.D11, DA.D11, EDA.D11, DUB.D11, DUBT.D11, SI_init.D11, H_init.D11, SI_update.D11, H_update.D11, HT.D11, HC.D11, ZS_update.D11, I_update.D11]
        - N: [DA.N, EDA.N, DUB.N, DUBT.N, SI_init.N, H_init.N, SI_update.N, H_update.N, HT.N, HC.N, ZS_update.N, I_update.N]
        - D_D10: [DP.D10, DT.D10]
        - EDA_D10: [DA.D10, EDA.D10]
        - H_D10: [SI_init.D10, H_init.D10, SI_update.D10, H_update.D10]
        - ZS_D10: [HC.D10, ZS_update.D10]
format:
  AH:
    rank-order:
      AH: [D1D0, N]
      AS: [D1, D0, N]
    bit-width: 32
    data-type: float
  A:
    rank-order:
      AH: [D1D0, N]
    bit-width: 32
    data-type: float
  BH:
    rank-order:
      BH: [B, T1T0, N]
      BS: [B, T1, T0, N]
    bit-width: 32
    data-type: float
  BF:
    rank-order:
      BH: [B, T1T0, N]
    bit-width: 32
    data-type: float
  CH:
    rank-order:
      CH: [B, T1T0, N]
      CS: [B, T1, T0, N]
    bit-width: 32
    data-type: float
  C:
    rank-order:
      CH: [B, T1T0, N]
    bit-width: 32
    data-type: float
  DH:
    rank-order:
      DH: [B, T1T0, D1D0]
      DS: [B, T1, T0, D11, D10, D0]
    bit-width: 32
    data-type: float
  DF:
    rank-order:
      DH: [B, T1T0, D1D0]
    bit-width: 32
    data-type: float
  UH:
    rank-order:
      UH: [B, T1T0, D1D0]
      US: [B, T1, T0, D11, D10, D0]
    bit-width: 32
    data-type: float
  U:
    rank-order:
      UH: [B, T1T0, D1D0]
    bit-width: 32
    data-type: float
  ZERO:
    rank-order:
      ZERO: [T0, D0]
      ZS_init: [T0, D0]
    bit-width: 32
    data-type: float
  I:
    rank-order:
      I_init: [B, T1I, D11ND10, D0]
      SI_init: [B, T1I, D11, N, D10, D0]
      I_update: [B, T1I, D11, N, D10, D0]
    bit-width: 32
    data-type: float
  AS:
    rank-order:
      AS: [B, D1, N, D0]
      DA: [B, D11, D10, N, D0]
    bit-width: 32
    data-type: float
  DS:
    rank-order:
      DS: [B, T1, D11, D10, T0, D0]
      DU: [B, T1, D11, D10, T0, D0]
      DP: [B, T1, D11, D10, T0, D0]
    bit-width: 32
    data-type: float
  DP:
    rank-order:
      DP: [B, T1, D11, D10, D0, T0]
      DT: [B, T1, D11, D10, D0, T0]
    bit-width: 32
    data-type: float
  DT:
    rank-order:
      DT: [B, T1, D11, D10, D0, T0]
      DA: [B, T1, D11, D10, D0, T0]
    bit-width: 32
    data-type: float
  US:
    rank-order:
      US: [B, T1, D11, D10, T0, D0]
      DU: [B, T1, D11, D10, T0, D0]
    bit-width: 32
    data-type: float
  DU:
    rank-order:
      DU: [B, T1, D11, D10, T0, D0]
      DUB: [B, T1, D11, D10, T0, D0]
    bit-width: 32
    data-type: float
  BS:
    rank-order:
      BS: [B, T1, T0, N]
      DUB: [B, T1, T0, N]
    bit-width: 32
    data-type: float
  CS:
    rank-order:
      CS: [B, T1, T0, N]
      HC: [B, T1, T0, N]
    bit-width: 32
    data-type: float
  ZS:
    rank-order:
      ZS_init: [B, T1, NI, D1, T0, D0]
      ZS_update: [B, T1, NI, D11, D10, T0, D0]
      ZH: [B, T1, NI, D1, T0, D0]
    bit-width: 32
    data-type: float
  DA:
    rank-order:
      DA: [B, T1, D11, N, D10, T0, D0]
      EDA: [B, T1, D11, N, D10, T0, D0]
    bit-width: 32
    data-type: float
  EDA:
    rank-order:
      EDA: [B, T1, D11, N, D10, D0, T0]
      SI_init: [B, T1, D11, N, D10, D0, T0]
      SI_update: [B, T1, D11, N, D10, D0, T0]
    bit-width: 32
    data-type: float
  DUB:
    rank-order:
      DUB: [B, T1, D11, N, D10, T0, D0]
      DUBT: [B, T1, D11, N, D10, T0, D0]
    bit-width: 32
    data-type: float
  DUBT:
    rank-order:
      DUBT: [B, T1, D11, N, D10, D0, T0]
      H_init: [B, T1, D11, N, D10, D0, T0]
      H_update: [B, T1, D11, N, D10, D0, T0]
    bit-width: 32
    data-type: float
  SI:
    rank-order:
