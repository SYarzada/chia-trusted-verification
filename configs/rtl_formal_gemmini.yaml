experiment:
  name: rtl_formal_gemmini
  engine: llm_agent
  seed: 0
  iterations: 4
  model: google-vertex/gemini-3.5-flash
  output_dir: ../runs/rtl_formal_gemmini/Q1_no_issue_with_dependencies/seed0
backend:
  name: rtl_formal
  settings:
    intent_catalog: ../rtl_formal/gemmini/intents.yaml
    # Add paths to generated Gemmini/Chipyard SystemVerilog files.
    rtl_globs: []
    workspace_root: ../runs/rtl_formal_gemmini/workspaces
    formal_engine: smtbmc
    solver: z3
    proof_depth: 20
    formal_timeout_s: 300
    strict_required_signals: false
  resources:
    prepare:
      formal: 1
    verify:
      formal: 1
    evaluate:
      formal: 1
    feedback:
      formal: 1
verification:
  intent:
    intent_id: Q1_no_issue_with_dependencies
    artifact_type: systemverilog_formal_collateral
    requirements:
      - assertions_compile
      - assertions_non_vacuous
      - prove_selected_intents
      - reach_selected_covers
      - trusted_assumption_policy
    parameters: {}
search:
  configs:
    llm_agent: search/llm_agent_rtl_formal.yaml
